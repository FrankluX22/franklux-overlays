<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>FrankluX — Camera Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --g:#00ff88;--gb:#00ff8838;--gx:#00ff8866;
  --w:#f0f4f0;--w2:#8a9e8a;--w3:#3a4e3a;
  --bg:#030806;
  --glow:0 0 8px #00ff8855,0 0 24px #00ff8820;
  --glow2:0 0 6px #00ff88,0 0 18px #00ff8877,0 0 40px #00ff8830;
}
body{
  width:1080px;height:1920px;
  background:transparent;
  overflow:hidden;
  font-family:'DM Mono',monospace;
}

/* ══ CAMERA FRAME — inferior izquierda ══ */
.cam{
  position:absolute;
  bottom:106px;
  left:40px;
  width:360px;
}

/* 16:9 ratio box */
.cam-ratio{
  position:relative;
  width:100%;
  padding-top:56.25%;
}

/* Transparent window — webcam shows through here */
.cam-window{
  position:absolute;inset:0;
  background:transparent;
}

/* Subtle vignette on edges of cam feed */
.cam-window::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 88% 88% at 50% 50%,transparent 50%,#03080677 100%);
  pointer-events:none;z-index:2;
}

/* Scanlines texture */
.cam-lines{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,#00000016 2px,#00000016 4px);
}

/* Glitch flicker */
.cam-glitch{
  position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;
  animation:gfx 9s steps(1) infinite;
}
@keyframes gfx{
  0%,94%,100%{opacity:0}
  95%{opacity:1;background:linear-gradient(180deg,transparent 30%,#00ff8809 30%,#00ff8809 31%,transparent 31%);}
  97%{opacity:1;background:linear-gradient(180deg,transparent 62%,#00ff8806 62%,#00ff8806 63%,transparent 63%);}
  99%{opacity:0;}
}

/* Moving scan line */
.cam-scan{
  position:absolute;left:0;right:0;height:1px;z-index:4;pointer-events:none;
  background:linear-gradient(90deg,transparent,#00ff8830,var(--g),#00ff8830,transparent);
  animation:cscan 4s linear infinite;opacity:0;
}
@keyframes cscan{
  0%{top:0;opacity:0}4%{opacity:.5}88%{opacity:.25}100%{top:100%;opacity:0}
}

/* ── OUTER BORDER ── */
.cam-border{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  border:1px solid var(--gb);
  box-shadow:var(--glow),inset 0 0 16px #00ff8805;
}

/* ── CORNER ACCENTS ── */
.ca{position:absolute;width:18px;height:18px;z-index:6;pointer-events:none;}
.ca::before,.ca::after{content:'';position:absolute;background:var(--g);box-shadow:var(--glow2);}
.ca::before{width:100%;height:2px;top:0;left:0;}
.ca::after{width:2px;height:100%;top:0;left:0;}
.ca.tl{top:-1px;left:-1px;}
.ca.tr{top:-1px;right:-1px;transform:scaleX(-1);}
.ca.bl{bottom:-1px;left:-1px;transform:scaleY(-1);}
.ca.br{bottom:-1px;right:-1px;transform:scale(-1);}

/* ── CORNER GLOW DOTS ── */
.cdot{position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--g);box-shadow:var(--glow2);z-index:7;pointer-events:none;}
.cdot.tl{top:5px;left:5px;}
.cdot.tr{top:5px;right:5px;}
.cdot.bl{bottom:5px;left:5px;}
.cdot.br{bottom:5px;right:5px;}

/* ── RULER TICKS ── */
.ticks-h{position:absolute;left:22px;right:22px;
  display:flex;justify-content:space-between;z-index:6;pointer-events:none;}
.ticks-h.top{top:3px;}.ticks-h.bot{bottom:3px;}
.th{width:1px;height:4px;background:var(--g);opacity:.25;}
.th.b{height:7px;opacity:.55;}

.ticks-v{position:absolute;top:14px;bottom:14px;
  display:flex;flex-direction:column;justify-content:space-between;z-index:6;pointer-events:none;}
.ticks-v.lft{left:3px;}.ticks-v.rgt{right:3px;}
.tv{width:4px;height:1px;background:var(--g);opacity:.25;}
.tv.b{width:7px;opacity:.55;}

/* ── CAM ID TAG (top left) ── */
.cam-id{
  position:absolute;top:-1px;left:-1px;z-index:8;
  background:#030806f0;
  border:1px solid var(--gb);border-bottom:none;border-left:none;
  padding:4px 12px;
  display:flex;align-items:center;gap:6px;
}
.cam-id-dot{
  width:5px;height:5px;border-radius:50%;background:var(--g);
  box-shadow:var(--glow2);
  animation:idpls 2s ease-in-out infinite;
}
@keyframes idpls{0%,100%{opacity:1}50%{opacity:.2}}
.cam-id-lbl{font-size:7px;letter-spacing:4px;color:var(--g);text-shadow:var(--glow);}

/* ── REC INDICATOR (top right) ── */
.cam-rec{
  position:absolute;top:-1px;right:-1px;z-index:8;
  background:#030806f0;
  border:1px solid var(--gb);border-bottom:none;border-right:none;
  padding:4px 10px;
  font-size:7px;letter-spacing:3px;color:var(--w3);
}

/* ══ NAME TAG (attached below frame) ══ */
.cam-nametag{
  width:100%;
  background:#030806f2;
  border:1px solid var(--gb);
  border-top:none;
  display:flex;align-items:center;
  padding:0;
  overflow:hidden;
  position:relative;
}

/* top edge glow line */
.cam-nametag::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--g),transparent);
  box-shadow:var(--glow);
  opacity:.5;
}

/* LIVE badge */
.nt-live{
  flex-shrink:0;
  padding:12px 14px;
  border-right:1px solid var(--gb);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:#00ff8806;
}
.nt-dot{
  width:6px;height:6px;border-radius:50%;background:var(--g);
  box-shadow:0 0 0 0 var(--g);
  animation:livering 1.6s ease-in-out infinite;
}
@keyframes livering{
  0%{box-shadow:0 0 0 0 #00ff8888}
  70%{box-shadow:0 0 0 7px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.nt-live-lbl{
  font-size:7px;letter-spacing:3px;color:var(--g);
  text-shadow:var(--glow);
}

/* Name + platform */
.nt-body{
  flex:1;padding:10px 14px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
}
.nt-name{
  font-family:'Syne',sans-serif;font-size:20px;font-weight:800;
  color:var(--w);letter-spacing:.5px;line-height:1;
}
.nt-platform{
  font-size:7px;letter-spacing:4px;color:var(--w3);
}

/* Right — stream indicator */
.nt-right{
  padding:10px 14px;border-left:1px solid var(--gb);
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;
}
.nt-tag{
  font-size:7px;letter-spacing:3px;color:var(--w3);
}
.nt-status{
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  color:var(--g);text-shadow:var(--glow);letter-spacing:1px;
}
</style>
</head>
<body>

<div class="cam">
  <!-- FRAME -->
  <div class="cam-ratio">

    <!-- Video window (transparent) -->
    <div class="cam-window">
      <div class="cam-lines"></div>
      <div class="cam-glitch"></div>
    </div>

    <!-- Animated scan -->
    <div class="cam-scan"></div>

    <!-- Border -->
    <div class="cam-border"></div>

    <!-- Corner accents -->
    <div class="ca tl"></div>
    <div class="ca tr"></div>
    <div class="ca bl"></div>
    <div class="ca br"></div>

    <!-- Glow dots -->
    <div class="cdot tl"></div>
    <div class="cdot tr"></div>
    <div class="cdot bl"></div>
    <div class="cdot br"></div>

    <!-- Ruler ticks — top -->
    <div class="ticks-h top">
      <div class="th b"></div><div class="th"></div><div class="th"></div>
      <div class="th b"></div><div class="th"></div><div class="th"></div>
      <div class="th b"></div><div class="th"></div><div class="th"></div>
      <div class="th b"></div>
    </div>
    <!-- Ruler ticks — bottom -->
    <div class="ticks-h bot">
      <div class="th b"></div><div class="th"></div><div class="th"></div>
      <div class="th b"></div><div class="th"></div><div class="th"></div>
      <div class="th b"></div><div class="th"></div><div class="th"></div>
      <div class="th b"></div>
    </div>
    <!-- Ruler ticks — left -->
    <div class="ticks-v lft">
      <div class="tv b"></div><div class="tv"></div>
      <div class="tv b"></div><div class="tv"></div>
      <div class="tv b"></div>
    </div>
    <!-- Ruler ticks — right -->
    <div class="ticks-v rgt">
      <div class="tv b"></div><div class="tv"></div>
      <div class="tv b"></div><div class="tv"></div>
      <div class="tv b"></div>
    </div>

    <!-- ID tag top left -->
    <div class="cam-id">
      <div class="cam-id-dot"></div>
      <span class="cam-id-lbl">CAM</span>
    </div>

    <!-- REC tag top right -->
    <div class="cam-rec">● REC</div>

  </div>

  <!-- NAME TAG below frame -->
  <div class="cam-nametag">
    <div class="nt-live">
      <div class="nt-dot"></div>
      <span class="nt-live-lbl">LIVE</span>
    </div>
    <div class="nt-body">
      <div class="nt-name">FrankluX</div>
      <div class="nt-platform">TIKTOK LIVE</div>
    </div>
    <div class="nt-right">
      <div class="nt-tag">STREAMING</div>
      <div class="nt-status" id="liveTime">00:00</div>
    </div>
  </div>
</div>

<script>
const t0=Date.now();
const pad=n=>String(n).padStart(2,'0');
setInterval(()=>{
  const s=Math.floor((Date.now()-t0)/1000);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  document.getElementById('liveTime').textContent=
    h>0?`${h}:${pad(m)}:${pad(sc)}`:`${pad(m)}:${pad(sc)}`;
},1000);
</script>
</body>
</html>
