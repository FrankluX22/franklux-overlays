<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>FrankluX - BRB</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #020a04;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
  }
  :root {
    --neon: #00ff88;
    --neon-glow: 0 0 10px #00ff88, 0 0 30px #00ff8855;
    --neon-glow-strong: 0 0 6px #00ff88, 0 0 20px #00ff88, 0 0 60px #00ff8888;
  }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 50%, #00ff8806 0%, transparent 70%),
      #020a04;
  }

  /* Rotating ring */
  .ring-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
    border-top-color: var(--neon);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .ring-1 { width: 700px; height: 700px; animation: spin 12s linear infinite; border-width: 1px; opacity: .15; }
  .ring-2 { width: 560px; height: 560px; animation: spin 8s linear infinite reverse; border-width: 1.5px; opacity: .2; border-right-color: var(--neon); border-top-color: transparent; }
  .ring-3 { width: 420px; height: 420px; animation: spin 5s linear infinite; border-width: 1px; opacity: .3; }
  .ring-4 { width: 300px; height: 300px; animation: spin 3s linear infinite reverse; border-width: 2px; opacity: .4; border-right-color: #00ffcc; }
  @keyframes spin { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }

  /* Central hex */
  .hex-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 200px;
    display: flex; align-items: center; justify-content: center;
  }
  .hex-center svg { width: 100%; height: 100%; }

  /* Grid overlay */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#00ff8806 1px, transparent 1px),
      linear-gradient(90deg, #00ff8806 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 80%);
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, #00ff8803 3px, #00ff8803 4px);
  }

  /* Top bar */
  .top-bar, .bottom-bar {
    position: absolute; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, transparent, var(--neon), #00ffcc, var(--neon), transparent);
    box-shadow: 0 0 20px var(--neon);
  }
  .top-bar { top: 0; }
  .bottom-bar { bottom: 0; }

  /* Side bars */
  .side-bar {
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, transparent, var(--neon), #00ffcc, var(--neon), transparent);
    box-shadow: 0 0 20px var(--neon);
    opacity: .3;
  }
  .side-bar.left { left: 0; }
  .side-bar.right { right: 0; }

  /* Content */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .brb-sub {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    letter-spacing: 10px;
    color: #00ff8866;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 20px;
  }
  .brb-sub::before, .brb-sub::after {
    content: '';
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, #00ff8866);
  }
  .brb-sub::after { background: linear-gradient(90deg, #00ff8866, transparent); }

  .brb-title {
    font-family: 'Orbitron', monospace;
    font-size: 120px;
    font-weight: 900;
    color: var(--neon);
    text-shadow: var(--neon-glow-strong);
    letter-spacing: 10px;
    text-align: center;
    animation: glitch-brb 6s steps(1) infinite;
    margin-bottom: 10px;
  }
  @keyframes glitch-brb {
    0%,85%,100% { transform: none; text-shadow: var(--neon-glow-strong); }
    87% { transform: translate(-6px); text-shadow: -6px 0 #ff004488; }
    89% { transform: translate(6px); text-shadow: 6px 0 #00ff8866; }
    91% { transform: none; }
    93% { transform: translate(-3px,2px); }
    95% { transform: none; }
  }

  .brb-line {
    width: 400px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    box-shadow: var(--neon-glow);
    margin-bottom: 20px;
  }

  .brb-msg {
    font-size: 24px;
    font-weight: 600;
    color: #00ff8877;
    letter-spacing: 4px;
    margin-bottom: 60px;
  }

  /* Loading bar */
  .loading-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    margin-bottom: 60px;
  }
  .loading-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: #00ff8844;
  }
  .loading-bar {
    width: 400px; height: 4px;
    background: #041008;
    border: 1px solid #00ff8822;
    position: relative;
    overflow: hidden;
  }
  .loading-fill {
    position: absolute;
    top: 0; left: -100%; bottom: 0;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--neon), #00ffcc, var(--neon), transparent);
    animation: loading 2.5s ease-in-out infinite;
  }
  @keyframes loading { 0%{left:-100%} 100%{left:100%} }

  /* Music (visual only) */
  .music-viz {
    display: flex; gap: 4px; align-items: flex-end;
    height: 50px;
    margin-bottom: 50px;
  }
  .bar {
    width: 8px;
    background: var(--neon);
    box-shadow: 0 0 6px var(--neon);
    animation: viz linear infinite;
    border-radius: 2px 2px 0 0;
  }
  @keyframes viz {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(var(--h)); }
  }

  /* Info */
  .brb-info {
    font-size: 16px;
    color: #00ff8855;
    letter-spacing: 3px;
    text-align: center;
  }

  /* Corner ornaments */
  .orn {
    position: absolute;
    width: 100px; height: 100px;
  }
  .orn svg { width: 100%; height: 100%; }
  .orn.tl { top: 40px; left: 40px; }
  .orn.tr { top: 40px; right: 40px; transform: scaleX(-1); }
  .orn.bl { bottom: 40px; left: 40px; transform: scaleY(-1); }
  .orn.br { bottom: 40px; right: 40px; transform: scale(-1); }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="grid"></div>
  <div class="scanlines"></div>

  <!-- Rings -->
  <div class="ring-container">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-4"></div>
    <div class="hex-center">
      <svg viewBox="0 0 200 200" fill="none">
        <polygon points="100,10 180,55 180,145 100,190 20,145 20,55"
          stroke="#00ff88" stroke-width="2" fill="#00ff8808"/>
        <polygon points="100,30 160,65 160,135 100,170 40,135 40,65"
          stroke="#00ff88" stroke-width="1" fill="none" opacity=".4"/>
        <text x="100" y="90" text-anchor="middle" font-family="Orbitron"
          font-size="22" font-weight="900" fill="#00ff88">BRB</text>
        <text x="100" y="120" text-anchor="middle" font-family="Rajdhani"
          font-size="13" font-weight="600" fill="#00ff8866" letter-spacing="3">VOLVIENDO</text>
      </svg>
    </div>
  </div>

  <!-- Bars -->
  <div class="top-bar"></div>
  <div class="bottom-bar"></div>
  <div class="side-bar left"></div>
  <div class="side-bar right"></div>

  <!-- Corners -->
  <div class="orn tl"><svg viewBox="0 0 100 100" fill="none">
    <polyline points="100,0 0,0 0,100" stroke="#00ff88" stroke-width="2" opacity=".6"/>
    <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="1" opacity=".3"/>
    <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".15"/>
    <circle cx="0" cy="0" r="8" fill="#00ff88" opacity=".5"/>
  </svg></div>
  <div class="orn tr"><svg viewBox="0 0 100 100" fill="none">
    <polyline points="100,0 0,0 0,100" stroke="#00ff88" stroke-width="2" opacity=".6"/>
    <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="1" opacity=".3"/>
    <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".15"/>
    <circle cx="0" cy="0" r="8" fill="#00ff88" opacity=".5"/>
  </svg></div>
  <div class="orn bl"><svg viewBox="0 0 100 100" fill="none">
    <polyline points="100,0 0,0 0,100" stroke="#00ff88" stroke-width="2" opacity=".6"/>
    <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="1" opacity=".3"/>
    <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".15"/>
    <circle cx="0" cy="0" r="8" fill="#00ff88" opacity=".5"/>
  </svg></div>
  <div class="orn br"><svg viewBox="0 0 100 100" fill="none">
    <polyline points="100,0 0,0 0,100" stroke="#00ff88" stroke-width="2" opacity=".6"/>
    <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="1" opacity=".3"/>
    <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".15"/>
    <circle cx="0" cy="0" r="8" fill="#00ff88" opacity=".5"/>
  </svg></div>

  <!-- Content -->
  <div class="content" style="padding-top: 240px;">
    <div class="brb-sub">EN PAUSA</div>
    <div class="brb-title">BRB</div>
    <div class="brb-line"></div>
    <div class="brb-msg">VUELVO EN UN MOMENTO</div>

    <!-- Loading -->
    <div class="loading-wrap">
      <div class="loading-label">▸ STREAM ACTIVO ◂</div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <!-- Music viz -->
    <div class="music-viz" id="viz"></div>

    <div class="brb-info">
      Sígueme en TikTok · Twitter · Instagram<br>
      <strong style="color:#00ff8888; font-size:18px;">@FrankluX</strong>
    </div>
  </div>

<script>
  // Music visualizer bars
  const viz = document.getElementById('viz');
  for(let i=0; i<24; i++){
    const b = document.createElement('div');
    b.className = 'bar';
    const h = 0.2 + Math.random()*0.8;
    b.style.cssText = `
      height: ${20 + Math.random()*30}px;
      --h: ${h};
      animation-duration: ${0.3 + Math.random()*0.6}s;
      animation-delay: ${Math.random()*0.5}s;
    `;
    viz.appendChild(b);
  }
</script>
</body>
</html>
