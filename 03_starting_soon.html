<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>FrankluX - Starting Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1080px;
    height: 1920px;
    background: #020a04;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
  }

  :root {
    --neon: #00ff88;
    --neon-dim: #00ff8822;
    --neon-glow: 0 0 10px #00ff88, 0 0 30px #00ff8855;
    --neon-glow-strong: 0 0 6px #00ff88, 0 0 20px #00ff88, 0 0 50px #00ff8888;
  }

  /* ── BACKGROUND ─────────────────────────────── */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 50%, #00ff8808 0%, transparent 70%),
      radial-gradient(ellipse 100% 60% at 50% 100%, #00ff8812 0%, transparent 60%),
      #020a04;
  }

  /* Grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#00ff8809 1px, transparent 1px),
      linear-gradient(90deg, #00ff8809 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
  }

  /* Perspective grid at bottom */
  .grid-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 500px;
    background: linear-gradient(180deg, transparent 0%, #00ff8806 100%);
    overflow: hidden;
  }

  /* Vertical scan lines */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      #00ff8803 3px, #00ff8803 4px
    );
    pointer-events: none;
  }

  /* Particles */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .p {
    position: absolute;
    border-radius: 50%;
    background: var(--neon);
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0%  { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: .6; }
    90% { opacity: .3; }
    100%{ transform: translateY(-1920px) scale(0.2); opacity: 0; }
  }

  /* ── DECORATIVE LINES ─────────────────────── */
  .h-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    opacity: .3;
  }
  .h-line.top { top: 140px; }
  .h-line.bot { bottom: 140px; }

  .v-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--neon), transparent);
    opacity: .2;
  }

  /* ── CORNER FRAMES ────────────────────────── */
  .corner-frame {
    position: absolute;
    width: 80px; height: 80px;
  }
  .corner-frame svg { width: 100%; height: 100%; }
  .corner-frame.tl { top: 40px; left: 40px; }
  .corner-frame.tr { top: 40px; right: 40px; transform: scaleX(-1); }
  .corner-frame.bl { bottom: 40px; left: 40px; transform: scaleY(-1); }
  .corner-frame.br { bottom: 40px; right: 40px; transform: scale(-1); }

  /* ── CONTENT ──────────────────────────────── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* Hexagon badge */
  .hex-badge {
    width: 120px; height: 120px;
    position: relative;
    margin-bottom: 40px;
  }
  .hex-badge svg { width: 100%; height: 100%; }

  /* STARTING SOON label */
  .pre-label {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 10px;
    color: #00ff8866;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .pre-label::before, .pre-label::after {
    content: '';
    display: block;
    width: 60px;
    height: 1px;
    background: var(--neon);
    opacity: .4;
  }

  /* Main title */
  .main-title {
    font-family: 'Orbitron', monospace;
    font-size: 96px;
    font-weight: 900;
    color: var(--neon);
    text-shadow: var(--neon-glow-strong);
    letter-spacing: 4px;
    text-align: center;
    line-height: .9;
    margin-bottom: 16px;
    position: relative;
  }

  /* Glitch effect */
  .main-title::before {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: #00ff8866;
    animation: glitch 4s steps(1) infinite;
    clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
  }
  @keyframes glitch {
    0%,90%,100%  { transform: translate(0); }
    92%          { transform: translate(-4px, 2px); }
    94%          { transform: translate(4px, -2px); }
    96%          { transform: translate(-2px, 0); }
    98%          { transform: translate(2px, 1px); }
  }

  .sub-title {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    color: #00ff8855;
    letter-spacing: 8px;
    margin-bottom: 70px;
  }

  /* Countdown */
  .countdown-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 70px;
  }
  .countdown-label {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 6px;
    color: #00ff8855;
  }
  .countdown {
    font-family: 'Orbitron', monospace;
    font-size: 72px;
    font-weight: 700;
    color: var(--neon);
    text-shadow: var(--neon-glow-strong);
    letter-spacing: 8px;
    position: relative;
  }
  .countdown::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 0; right: 0;
    height: 2px;
    background: var(--neon);
    box-shadow: var(--neon-glow);
  }

  /* Info panels */
  .info-row {
    display: flex;
    gap: 20px;
    margin-bottom: 60px;
  }
  .info-panel {
    background: #041008cc;
    border: 1px solid #00ff8833;
    border-top: 2px solid #00ff8866;
    padding: 20px 32px;
    text-align: center;
    min-width: 200px;
    position: relative;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  .info-panel-label {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: #00ff8855;
    margin-bottom: 8px;
  }
  .info-panel-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--neon);
    text-shadow: var(--neon-glow);
  }

  /* Social */
  .social-row {
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .social-item {
    font-size: 16px;
    font-weight: 600;
    color: #00ff8877;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .social-icon { font-size: 22px; }
  .social-sep {
    width: 4px; height: 4px;
    background: #00ff8844;
    transform: rotate(45deg);
  }

  /* Franklux branding */
  .brand {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    color: #00ff8822;
    letter-spacing: 12px;
  }

  /* Top bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, transparent, var(--neon), #00ffcc, var(--neon), transparent);
    box-shadow: 0 0 20px var(--neon);
  }
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, transparent, var(--neon), #00ffcc, var(--neon), transparent);
    box-shadow: 0 0 20px var(--neon);
  }

  /* Status bar top right */
  .status-top {
    position: absolute;
    top: 50px; right: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--neon);
    opacity: .6;
  }
  .status-blink {
    width: 8px; height: 8px;
    background: var(--neon);
    border-radius: 50%;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

</style>
</head>
<body>

  <!-- BACKGROUND -->
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="scanlines"></div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  <!-- DECORATIVE -->
  <div class="h-line top"></div>
  <div class="h-line bot"></div>
  <div class="v-line" style="left: 100px;"></div>
  <div class="v-line" style="right: 100px;"></div>
  <div class="v-line" style="left: 50%;"></div>

  <!-- TOP / BOTTOM BARS -->
  <div class="top-bar"></div>
  <div class="bottom-bar"></div>

  <!-- STATUS TOP RIGHT -->
  <div class="status-top">
    <div class="status-blink"></div>
    INICIANDO...
  </div>

  <!-- CORNER FRAMES -->
  <div class="corner-frame tl">
    <svg viewBox="0 0 80 80" fill="none">
      <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="2" opacity=".7"/>
      <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".3"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88" opacity=".6"/>
    </svg>
  </div>
  <div class="corner-frame tr">
    <svg viewBox="0 0 80 80" fill="none">
      <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="2" opacity=".7"/>
      <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".3"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88" opacity=".6"/>
    </svg>
  </div>
  <div class="corner-frame bl">
    <svg viewBox="0 0 80 80" fill="none">
      <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="2" opacity=".7"/>
      <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".3"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88" opacity=".6"/>
    </svg>
  </div>
  <div class="corner-frame br">
    <svg viewBox="0 0 80 80" fill="none">
      <polyline points="80,0 0,0 0,80" stroke="#00ff88" stroke-width="2" opacity=".7"/>
      <polyline points="60,0 0,0 0,60" stroke="#00ff88" stroke-width="1" opacity=".3"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88" opacity=".6"/>
    </svg>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">

    <!-- Hex Logo -->
    <div class="hex-badge">
      <svg viewBox="0 0 120 120" fill="none">
        <polygon points="60,4 110,32 110,88 60,116 10,88 10,32"
          stroke="#00ff88" stroke-width="2" fill="#00ff8808"
          filter="url(#glow)"/>
        <polygon points="60,16 98,38 98,82 60,104 22,82 22,38"
          stroke="#00ff88" stroke-width="1" fill="none" opacity=".4"/>
        <text x="60" y="52" text-anchor="middle" font-family="Orbitron" font-size="10"
          font-weight="700" fill="#00ff88" letter-spacing="1">FRANK</text>
        <text x="60" y="72" text-anchor="middle" font-family="Orbitron" font-size="10"
          font-weight="700" fill="#00ff88" letter-spacing="1">LUX</text>
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
    </div>

    <div class="pre-label">INICIANDO STREAM</div>

    <div class="main-title" data-text="FRANKLUX">FRANKLUX</div>
    <div class="sub-title">GAMING LIVE</div>

    <!-- Countdown -->
    <div class="countdown-wrap">
      <div class="countdown-label">▸ COMENZANDO EN</div>
      <div class="countdown" id="countdown">05:00</div>
    </div>

    <!-- Info panels -->
    <div class="info-row">
      <div class="info-panel">
        <div class="info-panel-label">JUEGO</div>
        <div class="info-panel-value">TBD</div>
      </div>
      <div class="info-panel">
        <div class="info-panel-label">MODO</div>
        <div class="info-panel-value">RANKED</div>
      </div>
      <div class="info-panel">
        <div class="info-panel-label">PLATAFORMA</div>
        <div class="info-panel-value">TikTok</div>
      </div>
    </div>

    <!-- Social -->
    <div class="social-row">
      <div class="social-item"><span class="social-icon">📱</span>@FrankluX</div>
      <div class="social-sep"></div>
      <div class="social-item"><span class="social-icon">🐦</span>@FrankluX</div>
      <div class="social-sep"></div>
      <div class="social-item"><span class="social-icon">📷</span>@FrankluX</div>
    </div>

  </div>

  <div class="brand">FRANKLUX</div>

<script>
  // Particles
  const pc = document.getElementById('particles');
  for(let i=0; i<40; i++){
    const p = document.createElement('div');
    p.className = 'p';
    const size = Math.random()*3+1;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:${Math.random()*20}%;
      animation-duration:${Math.random()*8+4}s;
      animation-delay:${Math.random()*6}s;
    `;
    pc.appendChild(p);
  }

  // Countdown
  let secs = 5*60;
  const cd = document.getElementById('countdown');
  function updateCD(){
    const m = Math.floor(secs/60), s = secs%60;
    cd.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(secs>0) secs--;
  }
  updateCD();
  setInterval(updateCD,1000);
</script>
</body>
</html>
